<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Propinish .</title>
    
    <link rel="apple-touch-icon" href="logo.png">
    <link rel="icon" type="image/png" href="logo.png">
    <meta name="mobile-web-app-capable" content="yes">

    <style>
        :root { --primary: #2563eb; --bg: #f8fafc; --card: #ffffff; --accent: #10b981; --danger: #ef4444; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); padding: 15px; color: #1e293b; max-width: 500px; margin: auto; }
        h1 { text-align: center; color: var(--primary); font-size: 2.2rem; margin-bottom: 5px; letter-spacing: -1px; }
        .subtitle { text-align: center; color: #64748b; font-size: 0.8rem; margin-bottom: 20px; }
        .card { background: var(--card); padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 20px; }
        h2 { color: #334155; font-size: 1.1rem; margin-top: 0; border-left: 4px solid var(--primary); padding-left: 10px; margin-bottom: 15px; }
        .grid-personal { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .checkbox-item { display: flex; align-items: center; gap: 8px; background: #f8fafc; padding: 10px; border-radius: 8px; border: 1px solid #f1f5f9; font-size: 0.85rem; }
        input, select { width: 100%; padding: 12px; border: 1px solid #e2e8f0; border-radius: 10px; box-sizing: border-box; font-size: 1rem; margin-top: 5px; }
        button { width: 100%; padding: 14px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; transition: 0.2s; margin-top: 10px; font-size: 1rem; }
        .btn-calc { background: var(--primary); color: white; }
        .btn-copy { background: var(--accent); color: white; }
        .btn-export { background: #4f46e5; color: white; margin-top: 20px; }
        #resultado { background: #f1f5f9; padding: 15px; border-radius: 10px; margin-top: 15px; white-space: pre-wrap; font-family: monospace; font-size: 0.85rem; display: none; border: 1px dashed #cbd5e1; color: #334155; }
        .tab-buttons { display: flex; gap: 8px; margin-bottom: 15px; }
        .tab-btn { background: #e2e8f0; flex: 1; padding: 10px; border-radius: 8px; font-size: 0.9rem; font-weight: 600; color: #64748b; }
        .tab-btn.active { background: var(--primary); color: white; }
        .hidden { display: none; }
        .stats-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #f1f5f9; }
        .monto { font-weight: bold; color: var(--accent); }
        .resumen-global { background: #eff6ff; padding: 15px; border-radius: 10px; margin-bottom: 15px; font-size: 0.9rem; border: 1px solid #dbeafe; }
        
        /* Estilo para items del historial con botón borrar */
        .history-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #f1f5f9; }
        .btn-delete-small { background: #fee2e2; color: var(--danger); padding: 5px 10px; border-radius: 6px; font-size: 0.7rem; width: auto; margin: 0; }
    </style>
</head>
<body>

    <h1>Propinish .</h1>
    <p class="subtitle">By Leonardo Ruiz.</p>

    <div class="tab-buttons">
        <button class="tab-btn active" id="btn-tab-calc" onclick="showTab('calc')">Calculadora</button>
        <button class="tab-btn" id="btn-tab-hist" onclick="showTab('historial')">Reporte Semanal</button>
    </div>

    <div id="tab-calc">
        <div class="card">
            <h2>Montos del Turno</h2>
            <div class="grid-personal">
                <div><label style="font-size:0.7rem; font-weight:bold">EFECTIVO</label><input type="number" id="efectivo" placeholder="0"></div>
                <div><label style="font-size:0.7rem; font-weight:bold">TRANSBANK</label><input type="number" id="transbank" placeholder="0"></div>
            </div>
            <select id="turno" style="margin-top:10px"><option value="AM">Mañana (AM)</option><option value="PM">Tarde (PM)</option></select>
        </div>

        <div class="card">
            <h2>Personal en Turno</h2>
            <div id="lista-full" class="grid-personal"></div>
            <div id="lista-part" class="grid-personal" style="margin-top:15px; border-top:1px solid #eee; padding-top:15px"></div>
        </div>

        <button class="btn-calc" onclick="calcular()">CALCULAR Y GUARDAR</button>
        <div id="resultado"></div>
        <button id="btn-copy" class="btn-copy hidden" onclick="copiarText('resultado')">COPIAR PARA WHATSAPP</button>
    </div>

    <div id="tab-historial" class="hidden">
        <div id="resumen-semanal-datos" class="resumen-global"></div>
        <div class="card">
            <h2>Acumulado por Garzón</h2>
            <div id="acumulado-garzones"></div>
            <button class="btn-export" onclick="exportarHistorial()">COPIAR REPORTE PARA JEFES</button>
        </div>
        <div class="card" style="font-size: 0.8rem;">
            <h2>Historial de Turnos (Modificable)</h2>
            <div id="historial-lista"></div>
            <button onclick="borrarTodo()" style="background:#fee2e2; color:#ef4444; margin-top:20px; border-radius:5px; padding:5px; width: auto; font-size: 0.7rem;">Reiniciar Toda la Semana</button>
        </div>
    </div>

    <textarea id="copy-area" style="position: absolute; left: -9999px;"></textarea>

    <script>
        const FULL_TIME = ["Anahis", "Angelica", "Jessi", "Juan", "Leonardo", "Liz", "Luis", "Maryu", "Neervison", "Rosmary", "Valentina"];
        const PART_TIME = ["Annel", "Costanza", "Elizabeth", "Estephani", "Francisca", "Genesis", "Monica"];

        function renderPersonal() {
            const fCont = document.getElementById('lista-full');
            const pCont = document.getElementById('lista-part');
            FULL_TIME.forEach(n => fCont.innerHTML += `<div class="checkbox-item"><input type="checkbox" class="chk-full" data-name="${n}" checked> ${n}</div>`);
            PART_TIME.forEach(n => pCont.innerHTML += `<div class="checkbox-item"><input type="checkbox" class="chk-part" data-name="${n}"> ${n}</div>`);
        }

        function calcular() {
            const ef = Math.floor(Number(document.getElementById('efectivo').value) || 0);
            const tb = Math.floor(Number(document.getElementById('transbank').value) || 0);
            const turno = document.getElementById('turno').value;
            const total = ef + tb;
            const cocina = Math.floor(total * 0.20);
            const repartir = total - cocina;

            const asistF = Array.from(document.querySelectorAll('.chk-full:checked')).map(c => c.dataset.name);
            const asistP = Array.from(document.querySelectorAll('.chk-part:checked')).map(c => c.dataset.name);
            const pts = (asistF.length * 1) + (asistP.length * 0.5);

            if (pts === 0) return alert("Selecciona personal");

            const vPunto = Math.floor(repartir / pts);
            const fecha = new Date().toLocaleDateString('es-CL');

            let res = `📅 *REPORTE PROPINISH ${fecha} (${turno})*\n--------------------------\n💰 Total: $${total.toLocaleString()}\n🥇 Pago Full: $${vPunto.toLocaleString()}\n🥈 Pago Part: $${Math.floor(vPunto*0.5).toLocaleString()}\n\n*Fulls:* ${asistF.join(', ')}\n*Parts:* ${asistP.join(', ')}`;

            document.getElementById('resultado').innerText = res;
            document.getElementById('resultado').style.display = 'block';
            document.getElementById('btn-copy').classList.remove('hidden');

            let db = JSON.parse(localStorage.getItem('propinish_db') || '[]');
            db.push({id: Date.now(), fecha, turno, vPunto, asistF, asistP, ef, tb, cocina, total});
            localStorage.setItem('propinish_db', JSON.stringify(db));
            actualizarVistas();
        }

        function eliminarTurno(id) {
            if(confirm("¿Seguro que quieres eliminar este turno?")) {
                let db = JSON.parse(localStorage.getItem('propinish_db') || '[]');
                db = db.filter(t => t.id !== id);
                localStorage.setItem('propinish_db', JSON.stringify(db));
                actualizarVistas();
            }
        }

        function actualizarVistas() {
            const db = JSON.parse(localStorage.getItem('propinish_db') || '[]');
            const listaA = document.getElementById('acumulado-garzones');
            const listaH = document.getElementById('historial-lista');
            const resSemanal = document.getElementById('resumen-semanal-datos');
            
            let totalesGarzones = {};
            let sumaEf = 0, sumaTb = 0, sumaCocina = 0;

            db.forEach(t => {
                sumaEf += (Number(t.ef) || 0);
                sumaTb += (Number(t.tb) || 0);
                sumaCocina += (Number(t.cocina) || 0);
                if(t.asistF) t.asistF.forEach(n => totalesGarzones[n] = (totalesGarzones[n] || 0) + (Number(t.vPunto) || 0));
                if(t.asistP) t.asistP.forEach(n => totalesGarzones[n] = (totalesGarzones[n] || 0) + Math.floor((Number(t.vPunto) || 0) * 0.5));
            });

            resSemanal.innerHTML = `<strong>RESUMEN SEMANAL</strong><br>💵 Ef: $${sumaEf.toLocaleString()} | 💳 TB: $${sumaTb.toLocaleString()}<br>👨‍🍳 Cocina: $${sumaCocina.toLocaleString()}<br><span style="color:var(--primary); font-weight:bold;">🏦 Entrega Jefa: $${(sumaTb-sumaCocina).toLocaleString()}</span>`;

            listaA.innerHTML = Object.keys(totalesGarzones).sort().map(n => `<div class="stats-item"><span>${n}</span><span class="monto">$${totalesGarzones[n].toLocaleString()}</span></div>`).join('') || "Sin datos.";

            listaH.innerHTML = db.slice().reverse().map(d => `
                <div class="history-item">
                    <span>${d.fecha} (${d.turno}): $${(Number(d.total) || 0).toLocaleString()}</span>
                    <button class="btn-delete-small" onclick="eliminarTurno(${d.id})">Borrar</button>
                </div>
            `).join('');
        }

        function exportarHistorial() {
            const db = JSON.parse(localStorage.getItem('propinish_db') || '[]');
            if(db.length === 0) return alert("No hay datos");
            let sumaEf = 0, sumaTb = 0, sumaCocina = 0, g = {};
            db.forEach(t => {
                sumaEf += (Number(t.ef)||0); sumaTb += (Number(t.tb)||0); sumaCocina += (Number(t.cocina)||0);
                if(t.asistF) t.asistF.forEach(n => g[n] = (g[n] || 0) + (Number(t.vPunto) || 0));
                if(t.asistP) t.asistP.forEach(n => g[n] = (g[n] || 0) + Math.floor((Number(t.vPunto) || 0) * 0.5));
            });

            let rep = `📊 *REPORTE SEMANAL PROPINISH .*\n--------------------------\n💰 *MONTO A ENTREGAR: $${(sumaTb-sumaCocina).toLocaleString()}*\n(TB: $${sumaTb.toLocaleString()} - Cocina: $${sumaCocina.toLocaleString()})\n--------------------------\n*ACUMULADO GARZONES:*\n`;
            Object.keys(g).sort().forEach(n => rep += `${n}: $${g[n].toLocaleString()}\n`);
            const area = document.getElementById('copy-area');
            area.value = rep; area.select(); document.execCommand('copy');
            alert("¡Reporte Semanal copiado!");
        }

        function copiarText(id) {
            const area = document.getElementById('copy-area');
            area.value = document.getElementById(id).innerText;
            area.select(); document.execCommand('copy');
            alert("¡Copiado!");
        }

        function showTab(tab) {
            document.getElementById('tab-calc').classList.toggle('hidden', tab !== 'calc');
            document.getElementById('tab-historial').classList.toggle('hidden', tab !== 'historial');
            document.getElementById('btn-tab-calc').classList.toggle('active', tab === 'calc');
            document.getElementById('btn-tab-hist').classList.toggle('active', tab === 'historial');
        }

        function borrarTodo() { if(confirm("¿Borrar toda la semana?")) { localStorage.removeItem('propinish_db'); location.reload(); } }

        renderPersonal();
        actualizarVistas();
    </script>
</body>
</html>
